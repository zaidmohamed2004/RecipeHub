<div class="recipes-page">

  <h1>Recipes</h1>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    Loading recipes...
  </div>

  <!-- Error -->
  <div *ngIf="!loading && error" class="error">
    {{ error }}
  </div>

  <!-- Recipes -->
  <div
    *ngIf="!loading && !error"
    class="recipes-grid"
  >

    <div
      *ngFor="let recipe of recipes"
      class="recipe-card"
    >

      <h2>
        {{ recipe.name }}
      </h2>

      <p>
        Category: {{ recipe.category }}
      </p>

      <h3>Ingredients</h3>

      <ul>
        <li
          *ngFor="let ingredient of recipe.ingredients"
        >
          {{ ingredient.product.name }}
          × {{ ingredient.quantity }}
        </li>
      </ul>

      <h3>Steps</h3>

      <p class="steps">
        {{ recipe.steps }}
      </p>

    </div>

  </div>

</div>
